
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Calculator</title>
</head>
<body>

    <h1>Python Calculator</h1>
    <p>Calculate using your Python application.</p>

    <form method="POST">

        <label>First Number:</label>
        <input type="number" step="any" name="num_1" required>

        <br><br>

        <label>Second Number:</label>
        <input type="number" step="any" name="num_2" required>

        <br><br>

        <label>Select Operation:</label>

        <select name="operation" required>
            <option value="add">Addition (+)</option>
            <option value="subtract">Subtraction (-)</option>
            <option value="multiply">Multiplication (*)</option>
            <option value="divide">Division (/)</option>
            <option value="modulus">Modulus (%)</option>
            <option value="percentage">Percentage (of)</option>
        </select>

        <br><br>

        <button type="submit">Calculate</button>

    </form>

    {% if result is not none %}
        <h2>Result</h2>
        <p>The answer of {{ expression }} is: {{ result }}</p>
    {% endif %}

    {% if error %}
        <p style="color: red;">Error: {{ error }}</p>
    {% endif %}

</body>
</html>
